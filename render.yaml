# Render blueprint for the ỌMA server (Express + Socket.IO). The website is hosted on Vercel.
# Secret values (DATABASE_URL, JWT_SECRET, PIN_PEPPER, CLIENT_URL) are entered in the Render dashboard.
services:
  - type: web
    name: oma-server
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: CLIENT_URL
        sync: false
